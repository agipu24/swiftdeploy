networks:
  swiftdeploy-net:
    driver: bridge

volumes:
  swiftdeploy-logs:

services:
  app:
    image: swift-deploy-1-node:latest
    networks:
      - swiftdeploy-net
    environment:
      - MODE=stable
      - APP_VERSION=1.0.0
      - APP_PORT=3000
    volumes:
      - swiftdeploy-logs:/app/logs
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    networks:
      - swiftdeploy-net
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - swiftdeploy-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
